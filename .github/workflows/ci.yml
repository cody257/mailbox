name: Release checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
      - name: Bootstrap hashed build tools from wheels
        run: python -m pip install --only-binary=:all: --require-hashes -r requirements-build.lock
      - name: Install locked runtime and test tools
        run: python -m pip install --no-build-isolation --require-hashes -r requirements-dev.lock
      - name: Install candidate without resolving dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Record interpreter and dependency compatibility
        run: |
          python --version
          python -m pip check
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test real browser, filesystem, recovery and distribution
        run: python -m pytest --browser chromium --tracing retain-on-failure --screenshot only-on-failure --output test-results
      - name: Build distributable artifacts
        run: python -m build --no-isolation
      - name: Verify contents, asset hashes and reviewed runtime licenses
        run: python scripts/check_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: synthetic-failure-${{ matrix.os }}-${{ matrix.python }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15'
      - run: python -m pip install --only-binary=:all: --require-hashes -r requirements-build.lock
      - run: python -m pip install --no-build-isolation --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m playwright install --with-deps firefox webkit
      - run: python -m pytest -m rendering --browser firefox --browser webkit --tracing retain-on-failure --screenshot only-on-failure --output test-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: synthetic-rendering-failure
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install --only-binary=:all: --require-hashes -r requirements-build.lock
      - run: python -m pip install --no-build-isolation --require-hashes -r requirements-dev.lock
      - name: Audit locked Python and browser dependencies
        run: |
          python -m pip_audit --require-hashes --disable-pip -r requirements-dev.lock
          python -m pip_audit --require-hashes --disable-pip -r requirements-build.lock
          python scripts/audit_js.py
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          mkdir -p .tools
          curl --fail --location --retry 3 --output .tools/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  .tools/gitleaks.tar.gz' | sha256sum --check
          tar -xzf .tools/gitleaks.tar.gz -C .tools gitleaks
      - name: Scan complete history and source
        run: |
          .tools/gitleaks git --log-opts="--all --full-history" --redact=100 --ignore-gitleaks-allow --exit-code=1 .
          .tools/gitleaks dir --redact=100 --ignore-gitleaks-allow --exit-code=1 .
      - name: Build and scan unpacked release artifacts
        run: |
          python -m build --no-isolation
          python scripts/check_release.py
          mkdir -p .audit/release
          python scripts/unpack_release.py .audit/release
          .tools/gitleaks dir --redact=100 --ignore-gitleaks-allow --exit-code=1 .audit/release
