[project]
name = "mailbox-local"
version = "0.1.0"
description = "Local Gmail viewer that turns your inbox into plain files on disk."
readme = "README.md"
requires-python = ">=3.11.5"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Cody LeCates"}]
dependencies = [
    "flask>=3.1.3",
    "werkzeug>=3.1.9",
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.1",
    "markdownify>=1.2.3",
    "beautifulsoup4>=4.14",
    "python-frontmatter>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-playwright>=0.7", "build>=1.2", "pip-audit>=2.9", "pip-licenses>=5.0", "setuptools>=84", "wheel>=0.45"]

[project.scripts]
mailbox-serve = "mailbox_app.server:main"
mailbox-sync = "mailbox_app.sync:main"

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mailbox_app*"]

[tool.setuptools.package-data]
mailbox_app = ["templates/*.html", "static/*.js", "static/*.css", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: real browser and local server journeys", "rendering: cross-browser content safety"]
addopts = "-ra"
